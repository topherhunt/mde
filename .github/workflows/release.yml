name: Build and Release

# Builds the macOS .dmg and Windows installer. scripts/release.sh runs this with
# release=true, which attaches both to a DRAFT release for package.json's version
# at this commit; the script publishes it (creating the tag) once you confirm.
# Run it by hand from the Actions tab, release unticked, to check the builds only.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Attach the builds to a draft release (scripts/release.sh sets this)
        type: boolean
        default: false

permissions:
  contents: write # required for the release job to create the Release

jobs:
  build:
    strategy:
      fail-fast: false # a failure on one OS shouldn't cancel the other
      matrix:
        include:
          - os: macos-latest
            assets: out/make/**/*.dmg
          - os: windows-latest
            assets: out/make/**/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run release

      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.assets }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: inputs.release && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mapfile -t FILES < <(find artifacts -type f)
          gh release create "v$VERSION" "${FILES[@]}" --draft --target "$GITHUB_SHA" \
            --title "MDE $VERSION" --generate-notes
